[package]
name = "kajiba-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kajiba"
path = "src/main.rs"

[dependencies]
clap.workspace = true
kajiba-proto = { path = "../../crates/kajiba-proto" }
# Already transitive: terminal echo off while `login` reads a token (ADR 0091).
libc.workspace = true
tokio.workspace = true
# TLS for an https forge URL, with the system certificate store (0076).
tonic = { workspace = true, features = ["tls-native-roots"] }
tonic-types.workspace = true
