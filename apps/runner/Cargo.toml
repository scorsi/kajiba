[package]
name = "kajiba-runner"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kajiba-runner"
path = "src/main.rs"

[features]
default = ["systemd"]
# Disabled only by the unprivileged fake-Nix e2e harness.
systemd = []

[dependencies]
# Already transitive (tonic): the loopback `/metrics` listener (0022).
axum.workspace = true
# Already transitive (tonic): adapts the TLS stream to the channel's connector (0127).
hyper-util.workspace = true
clap.workspace = true
kajiba-proto = { path = "../../crates/kajiba-proto" }
kajiba-core = { path = "../../crates/kajiba-core" }
kajiba-exec = { path = "../../crates/kajiba-exec" }
# Already transitive: the hostname from the OS (0019 as amended).
libc.workspace = true
# Reads `nix config show --json` (0009).
serde_json.workspace = true
# Persist restart-safe attempt records (0155).
serde.workspace = true
tokio.workspace = true
# Already transitive (tonic): the outbound half of the runner stream.
tokio-stream.workspace = true
# The kajiba.runner.v1 client; TLS is the runner's own connector, never the system store (0123).
tonic.workspace = true
# The runner's connector: TLS 1.3 with its SVID (0123, 0124).
tokio-rustls.workspace = true
# Already transitive (tonic): the log facade of the nisshi layer (0022).
tracing.workspace = true

[dev-dependencies]
# The fake forge serves the bundles the server would (0106).
kajiba-gitstore = { path = "../../crates/kajiba-gitstore" }
