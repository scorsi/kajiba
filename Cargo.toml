[workspace]
resolver = "2"
members = ["crates/*", "apps/server", "apps/git", "apps/runner", "apps/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/scorsi/kajiba"

[workspace.dependencies]
axum = "0.7"
# Already transitive (sqlx, tonic): opaque list cursors (0020).
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
# GitStore reads (0003); tree diff needs `blob-diff`.
gix = { version = "0.90", default-features = false, features = ["sha1", "blob-diff"] }
http = "1"
http-body = "1"
# Already transitive (tokio): O_NONBLOCK for configuration and secret file opens.
libc = "0.2"
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "server-auto", "service"] }
prost = "0.13"
# Reads custom method options from the encoded descriptor set (0076).
prost-reflect = { version = "0.15", default-features = false }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
serde = { version = "1", features = ["derive"] }
ssh-key = { version = "0.6.7", default-features = false, features = ["alloc", "ecdsa"] }
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
toml = "0.8"
# Software authenticator for ceremony tests, dev only (0076).
webauthn-authenticator-rs = { version = "0.5", default-features = false, features = ["softpasskey"] }
# Passkey relying party (0014, 0076); `conditional-ui` provides discoverable login.
webauthn-rs = { version = "0.5", default-features = false, features = ["conditional-ui"] }
# Already transitive (gix): inflates gzipped git upload-pack requests.
zlib-rs = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "process", "io-util"] }
tokio-stream = "0.1"
tonic = "0.12"
tonic-types = "0.12"
# grpc-web on the kajiba.v1 routes (0005, 0076).
tonic-web = { version = "0.12", default-features = false }
# Already transitive (tonic): applies the grpc-web layer to the kajiba.v1 routes (0088).
tower-layer = "0.3"
tonic-build = "0.12"
tonic-reflection = { version = "0.12", default-features = false, features = ["server"] }

[profile.dev]
# mold/lld in the devShell do the heavy lifting; LTO stays off for fast iteration (0002).
lto = false

# Dependencies keep only line tables in dev builds: target/ stays far smaller, backtraces
# stay complete; kajiba's own crates keep full debug info for debuggers.
[profile.dev.package."*"]
debug = "line-tables-only"
