syntax = "proto3";

package kajiba.admin.v1;

// Host-local administration, authorized by Unix peer credentials (0014).
service AdminService {
  // Revoke the user's passkeys, sessions and runtime PATs, then issue a
  // single-use passkey enrollment link (0014).
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  // Map repository public ids (directory names under repos/) to names, archived
  // repositories included and marked (0012, 0026). Ordered by <owner>/<name>.
  rpc ListRepos(ListReposRequest) returns (ListReposResponse);
  // Import the branches and tags of a path, bundle or URL into a declared, empty
  // repository; the refs become `push` events by `system` (0003, 0026).
  rpc Import(ImportRequest) returns (ImportResponse);
  // Run the CI retention pass now: delete the logs of attempts finished more than
  // `ci.log_retention` ago; runs are kept (0010, 0115).
  rpc Retention(RetentionRequest) returns (RetentionResponse);
  // Produce a verified dump in the configured directory under maintenance (0169).
  rpc Dump(DumpRequest) returns (DumpResponse);
}

message EnrollRequest {
  string user = 1;
}

message EnrollResponse {
  string url = 1;
}

message ListReposRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListReposResponse {
  repeated Repo repos = 1;
  string next_page_token = 2;
}

message Repo {
  string public_id = 1;
  string owner = 2;
  string name = 3;
  bool archived = 4;
}

message ImportRequest {
  // <owner>/<name>
  string repo = 1;
  // An absolute path to a bare repository or a bundle, or a URL without userinfo,
  // query or fragment (0041, 0044).
  string source = 2;
  // `user:token` or a token alone, for an http(s) source; read by the CLI from
  // `--credentials-file`, never logged (0044).
  string credentials = 3;
}

message ImportResponse {
  // Number of imported refs.
  uint32 refs = 1;
}

message RetentionRequest {}

message RetentionResponse {
  // Number of attempts whose logs were deleted.
  uint64 logs = 1;
  // Number of worktree runs deleted with their bundle (0097).
  uint64 worktree_runs = 2;
}

message DumpRequest {}

message DumpResponse {
  // Absolute path to the completed, verified directory.
  string dir = 1;
}
