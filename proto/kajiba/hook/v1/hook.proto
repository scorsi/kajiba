syntax = "proto3";

package kajiba.hook.v1;

// The SSH integration and the Git hooks, over the local socket (0003, 0004).
service HookService {
  // Resolve an SSH auth key fingerprint to an active user and the canonical
  // stored key, for sshd's AuthorizedKeysCommand (0004, 0014). An unknown
  // fingerprint, a signing-only key or a disabled user is NOT_FOUND
  // (KEY_NOT_FOUND).
  rpc GetAuthKey(GetAuthKeyRequest) returns (GetAuthKeyResponse);
  // `kajiba-git hook pre-receive`: check a push's ref updates before
  // receive-pack applies them; allowed only once every check passed and the
  // push is admitted (0003, 0014).
  rpc PreReceive(PreReceiveRequest) returns (PreReceiveResponse);
  // `kajiba-git hook post-receive`: receive-pack updated refs; wakes push
  // reconciliation and returns without waiting for receive-pack (0003).
  rpc PostReceive(PostReceiveRequest) returns (PostReceiveResponse);
}

message GetAuthKeyRequest {
  // `SHA256:` followed by the unpadded base64 digest, as sshd's %f prints it.
  string fingerprint = 1;
}

message GetAuthKeyResponse {
  string user_public_id = 1;
  // The OpenSSH key without comment or options (`ssh_key.public_key`).
  string public_key = 2;
}

// One line of the hook's stdin, in receive order. A zero id (40 zeros) is an
// absent ref: creation when old, deletion when new.
message RefUpdate {
  string ref_name = 1;
  string old_id = 2;
  string new_id = 3;
}

// Git's quarantine environment of the pre-receive hook, passed verbatim so the
// daemon's Git checks see the pushed objects (0014). Empty when Git set none
// (a push that only deletes refs).
message Quarantine {
  // GIT_OBJECT_DIRECTORY
  string object_directory = 1;
  // GIT_ALTERNATE_OBJECT_DIRECTORIES, in Git's own encoding
  string alternate_object_directories = 2;
  // GIT_QUARANTINE_PATH
  string quarantine_path = 3;
}

message PreReceiveRequest {
  // Transport context set by serve-ssh (KAJIBA_USER, KAJIBA_REPO, KAJIBA_SESSION).
  string user_public_id = 1;
  string repo_public_id = 2;
  repeated RefUpdate updates = 3;
  Quarantine quarantine = 4;
  string session_id = 5;
}

message PreReceiveResponse {
  bool allowed = 1;
  // Why the push is refused; shown to the pusher.
  repeated Refusal refusals = 2;
}

message Refusal {
  // Empty when the reason concerns the whole push.
  string ref_name = 1;
  string reason = 2;
}

message PostReceiveRequest {
  string user_public_id = 1;
  string repo_public_id = 2;
  repeated RefUpdate updates = 3;
  string session_id = 4;
}

message PostReceiveResponse {}
