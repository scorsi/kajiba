syntax = "proto3";

package kajiba.v1;

import "google/protobuf/timestamp.proto";
import "kajiba/v1/options.proto";

// CI runs (0008, 0010, 0013). `repo` is a public id or <owner>/<name>, current or
// previous; a repository the caller cannot read is REPO_NOT_FOUND (0020).
service RunService {
  // A manual run of any commit reachable from a ref of the repository,
  // `refs/contrib/*` included (0013). Needs the `write` role (ADR 0114):
  // ROLE_MISSING below it; INVALID_STATE for an archived repository, CI_DISABLED when
  // CI is off, REVISION_NOT_FOUND for an unknown or unreachable commit.
  rpc TriggerRun(TriggerRunRequest) returns (TriggerRunResponse) {
    option (kajiba.v1.scope) = SCOPE_CI_TRIGGER;
  }
  // By public id; RUN_NOT_FOUND when absent or its repository is unreadable.
  rpc GetRun(GetRunRequest) returns (GetRunResponse) {
    option (kajiba.v1.scope) = SCOPE_REPO_READ;
  }
  // A repository's runs, newest first (0020 pagination).
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse) {
    option (kajiba.v1.scope) = SCOPE_REPO_READ;
  }
}

message TriggerRunRequest {
  string repo = 1;
  // A full commit id.
  string sha = 2;
}

message TriggerRunResponse {
  Run run = 1;
}

message GetRunRequest {
  string run = 1;
}

message GetRunResponse {
  Run run = 1;
}

message ListRunsRequest {
  string repo = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListRunsResponse {
  repeated Run runs = 1;
  string next_page_token = 2;
}

enum RunTrigger {
  RUN_TRIGGER_UNSPECIFIED = 0;
  RUN_TRIGGER_PUSH = 1;
  RUN_TRIGGER_MANUAL = 2;
}

enum RunState {
  RUN_STATE_UNSPECIFIED = 0;
  RUN_STATE_QUEUED = 1;
  RUN_STATE_RUNNING = 2;
  RUN_STATE_SUCCEEDED = 3;
  RUN_STATE_FAILED = 4;
  RUN_STATE_CANCELLED = 5;
}

message Run {
  string public_id = 1;
  string repo_public_id = 2;
  string sha = 3;
  // The pushed ref; empty for a manual run.
  string ref = 4;
  RunTrigger trigger = 5;
  // The user who pushed or triggered; empty for an import.
  string triggered_by = 6;
  RunState state = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp started_at = 9;
  google.protobuf.Timestamp finished_at = 10;
  // One job per run until pipeline files exist (0010).
  Job job = 11;
  // Set for a failed run.
  FailureSummary failure = 12;
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_PENDING = 1;
  JOB_STATE_ASSIGNED = 2;
  JOB_STATE_RUNNING = 3;
  JOB_STATE_SUCCEEDED = 4;
  JOB_STATE_FAILED = 5;
  JOB_STATE_CANCELLED = 6;
  JOB_STATE_LOST = 7;
}

message Job {
  string public_id = 1;
  string name = 2;
  JobState state = 3;
  // Why no runner takes it (0109): `no-connected-runner`, `backend-unavailable`,
  // `tags-unmatched`, `runners-busy`; empty otherwise.
  string pending_reason = 4;
  // The latest attempt; absent before the first assignment.
  Attempt current_attempt = 5;
}

enum AttemptState {
  ATTEMPT_STATE_UNSPECIFIED = 0;
  ATTEMPT_STATE_RUNNING = 1;
  ATTEMPT_STATE_SUCCEEDED = 2;
  ATTEMPT_STATE_FAILED = 3;
  ATTEMPT_STATE_CANCELLED = 4;
  ATTEMPT_STATE_LOST = 5;
}

message Attempt {
  string public_id = 1;
  // From 1.
  uint32 number = 2;
  AttemptState state = 3;
  // The runner's declared name and the hostname it reported (informational).
  string runner = 4;
  string runner_hostname = 5;
  optional int32 exit_code = 6;
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp finished_at = 8;
}

// Enough to explain a failure without another request (ADR 0112).
message FailureSummary {
  // The failing check when the backend knows it structurally; often empty.
  string check = 1;
  // E.g. `exit status 1`, `lease-expired`.
  string reason = 2;
  // The last lines (at most 20) of the current attempt's stored log.
  repeated string last_log_lines = 3;
}
