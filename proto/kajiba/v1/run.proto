syntax = "proto3";

package kajiba.v1;

import "google/protobuf/timestamp.proto";
import "kajiba/v1/options.proto";

// CI runs (0008, 0010, 0013). `repo` is a public id or <owner>/<name>, current or
// previous; a repository the caller cannot read is REPO_NOT_FOUND (0020).
service RunService {
  // A manual run of any commit reachable from a ref of the repository,
  // `refs/contrib/*` included (0013). Needs the `write` role (ADR 0114):
  // ROLE_MISSING below it; INVALID_STATE for an archived repository, CI_DISABLED when
  // CI is off, REVISION_NOT_FOUND for an unknown or unreachable commit.
  rpc TriggerRun(TriggerRunRequest) returns (TriggerRunResponse) {
    option (kajiba.v1.scope) = SCOPE_CI_TRIGGER;
  }
  // Cancel an unfinished run; terminal runs are unchanged (ADR 0163).
  rpc CancelRun(CancelRunRequest) returns (CancelRunResponse) {
    option (kajiba.v1.scope) = SCOPE_CI_TRIGGER;
  }
  // Create a new linked run with the same source and requirements (ADR 0163).
  rpc RerunRun(RerunRunRequest) returns (RerunRunResponse) {
    option (kajiba.v1.scope) = SCOPE_CI_TRIGGER;
  }
  // By public id; RUN_NOT_FOUND when absent or its repository is unreadable.
  rpc GetRun(GetRunRequest) returns (GetRunResponse) {
    option (kajiba.v1.scope) = SCOPE_REPO_READ;
  }
  // A repository's runs, newest first (0020 pagination).
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse) {
    option (kajiba.v1.scope) = SCOPE_REPO_READ;
  }
  // A run's log: the stored bytes from `offset`, then, when following, live bytes as
  // the forge stores them, then the run once terminal, and the stream ends. Each
  // attempt's bytes are preceded by its section marker; a replayed attempt opens a new
  // section. Not bound by the request timeout. At most 16 open per caller and 256 in all
  // (RESOURCE_EXHAUSTED / WATCH_STREAMS_LIMIT); a stream not read for 60 s is cut (ADR 0120).
  // A following stream quiet for 20 s carries a keepalive (ADR 0129).
  rpc WatchRun(WatchRunRequest) returns (stream WatchRunResponse) {
    option (kajiba.v1.scope) = SCOPE_REPO_READ;
  }
  // The ids `refs/heads/*` and `refs/tags/*` point to, for a worktree run's bundle
  // (0097), after the checks a worktree run's creation makes (ADR 0118): REPO_NOT_FOUND,
  // INVALID_STATE (archived), ROLE_MISSING (below `write`), CI_DISABLED, INVALID_FIELD
  // (check, system or feature name), NO_MATCHING_RUNNER, WORKTREE_RUNS_LIMIT.
  rpc GetWorktreeBase(GetWorktreeBaseRequest) returns (GetWorktreeBaseResponse) {
    option (kajiba.v1.scope) = SCOPE_CI_TRIGGER;
  }
  // A worktree run from an uploaded git bundle (0097): the spec first, checked as by
  // GetWorktreeBase before any bundle byte is stored, then the bundle in chunks.
  // BUNDLE_TOO_LARGE above 64 MiB, BUNDLE_INVALID when not a bundle with exactly one
  // head, BUNDLE_PREREQUISITE_MISSING when a prerequisite is not reachable from
  // `refs/heads/*` or `refs/tags/*`; INVALID_FIELD when the messages are out of order.
  // Not bound by the request timeout: DEADLINE_EXCEEDED after 30 s without a byte or
  // 10 min in all (ADR 0120).
  rpc CreateWorktreeRun(stream CreateWorktreeRunRequest) returns (CreateWorktreeRunResponse) {
    option (kajiba.v1.scope) = SCOPE_CI_TRIGGER;
  }
}

message TriggerRunRequest {
  string repo = 1;
  // A full commit id.
  string sha = 2;
}

message TriggerRunResponse {
  Run run = 1;
}

message CancelRunRequest {
  string run = 1;
}
message CancelRunResponse {
  Run run = 1;
}
message RerunRunRequest {
  string run = 1;
}
message RerunRunResponse {
  Run run = 1;
}

message GetRunRequest {
  string run = 1;
}

message GetRunResponse {
  Run run = 1;
}

message ListRunsRequest {
  string repo = 1;
  int32 page_size = 2;
  string page_token = 3;
  // Only runs in one of these states; empty for all. INVALID_FIELD for an unknown or
  // unspecified state (ADR 0131).
  repeated RunState states = 4;
  // Only runs of this exact full ref (`refs/heads/main`); empty for all. Manual and
  // worktree runs have no ref and match none (ADR 0138).
  string ref = 5;
}

message ListRunsResponse {
  repeated Run runs = 1;
  string next_page_token = 2;
}

enum RunTrigger {
  RUN_TRIGGER_UNSPECIFIED = 0;
  RUN_TRIGGER_PUSH = 1;
  RUN_TRIGGER_MANUAL = 2;
  RUN_TRIGGER_WORKTREE = 3;
}

enum RunState {
  RUN_STATE_UNSPECIFIED = 0;
  RUN_STATE_QUEUED = 1;
  RUN_STATE_RUNNING = 2;
  RUN_STATE_SUCCEEDED = 3;
  RUN_STATE_FAILED = 4;
  RUN_STATE_CANCELLED = 5;
}

message Run {
  string public_id = 1;
  string repo_public_id = 2;
  string sha = 3;
  // The pushed ref; empty for a manual or worktree run.
  string ref = 4;
  RunTrigger trigger = 5;
  // The user who pushed or triggered; empty for an import.
  string triggered_by = 6;
  RunState state = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp started_at = 9;
  google.protobuf.Timestamp finished_at = 10;
  // One job per run until pipeline files exist (0010).
  Job job = 11;
  // Set for a failed run.
  FailureSummary failure = 12;
  // A worktree run's selected checks; empty for the whole `nix flake check` (0097).
  repeated string checks = 13;
  // Client-reported HEAD before capture; display metadata only (ADR 0151).
  string base_sha = 14;
  // Original run public id; empty for a first run (ADR 0163).
  string rerun_of = 15;
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_PENDING = 1;
  JOB_STATE_ASSIGNED = 2;
  JOB_STATE_RUNNING = 3;
  JOB_STATE_SUCCEEDED = 4;
  JOB_STATE_FAILED = 5;
  JOB_STATE_CANCELLED = 6;
  JOB_STATE_LOST = 7;
}

message Job {
  string public_id = 1;
  string name = 2;
  JobState state = 3;
  // Why no runner takes it (0109): `no-connected-runner`, `backend-unavailable`,
  // `tags-unmatched`, `runners-busy`; empty otherwise.
  string pending_reason = 4;
  // The latest attempt; absent before the first assignment.
  Attempt current_attempt = 5;
}

enum AttemptState {
  ATTEMPT_STATE_UNSPECIFIED = 0;
  ATTEMPT_STATE_RUNNING = 1;
  ATTEMPT_STATE_SUCCEEDED = 2;
  ATTEMPT_STATE_FAILED = 3;
  ATTEMPT_STATE_CANCELLED = 4;
  ATTEMPT_STATE_LOST = 5;
}

message Attempt {
  string public_id = 1;
  // From 1.
  uint32 number = 2;
  AttemptState state = 3;
  // The runner's declared name and the hostname it reported (informational).
  string runner = 4;
  string runner_hostname = 5;
  optional int32 exit_code = 6;
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp finished_at = 8;
}

// Enough to explain a failure without another request (ADR 0112).
message FailureSummary {
  // The failing check when the backend knows it structurally; often empty.
  string check = 1;
  // E.g. `exit status 1`, `lease-expired`.
  string reason = 2;
  // The last lines (at most 20) of the current attempt's stored log.
  repeated string last_log_lines = 3;
}

message WatchRunRequest {
  string run = 1;
  // Bytes of the run's log already received: resume after them.
  uint64 offset = 2;
  // Wait for new bytes and the terminal state; otherwise end after the stored bytes.
  bool follow = 3;
}

message WatchRunResponse {
  oneof event {
    LogSection section = 1;
    LogBytes log = 2;
    // The run, sent once terminal (with its failure summary); the stream then ends.
    Run finished = 3;
    // Sent after 20 s without another message on a following stream, so that proxies
    // timing out idle streams keep it open; carries nothing and is to be ignored (ADR 0129).
    WatchKeepalive keepalive = 4;
  }
}

message WatchKeepalive {}

// The start of an attempt's bytes in the run's log.
message LogSection {
  Attempt attempt = 1;
  // Where the attempt's bytes start in the run's log.
  uint64 offset = 2;
}

message LogBytes {
  // Where `data` starts in the run's log: the attempts' logs one after the other.
  uint64 offset = 1;
  bytes data = 2;
  // UTC epoch milliseconds of the original runner chunk; 0 if unknown.
  int64 produced_at_ms = 3;
}

// A worktree run to create (0097, ADR 0118).
message WorktreeRunSpec {
  string repo = 1;
  // A Nix system, `<arch>-<os>`.
  string system = 2;
  // Check names to build; empty runs the whole `nix flake check`.
  repeated string checks = 3;
  // The selected checks' `requiredSystemFeatures`, required as runner tags.
  repeated string features = 4;
  // Client-reported HEAD before capture; empty for older clients (ADR 0151).
  string base_sha = 5;
}

message GetWorktreeBaseRequest {
  WorktreeRunSpec spec = 1;
}

message GetWorktreeBaseResponse {
  // Distinct, sorted; empty for an empty repository.
  repeated string ids = 1;
}

message CreateWorktreeRunRequest {
  oneof part {
    // The first message, and only it.
    WorktreeRunSpec spec = 1;
    // The bundle's bytes, in order; a message holds at most 16 KiB (0057), so
    // chunks of 16000 bytes at most.
    bytes chunk = 2;
  }
}

message CreateWorktreeRunResponse {
  Run run = 1;
}
