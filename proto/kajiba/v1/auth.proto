syntax = "proto3";

package kajiba.v1;

import "kajiba/v1/options.proto";

// Browser sessions (0014, 0079); opened by the WebAuthn ceremonies under /auth/webauthn/.
service AuthService {
  // Deletes the session named by the `kajiba_session` cookie, if any, and clears the
  // cookie. Public: an expired or unknown cookie is still cleared, and only the holder
  // of a session's secret can name it.
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (kajiba.v1.public_access) = true;
  }

  // The signed-in caller, for the web application. Any credential holding `repo:read`
  // may call it; an unauthenticated call is refused by the interceptor.
  rpc GetViewer(GetViewerRequest) returns (GetViewerResponse) {
    option (kajiba.v1.scope) = SCOPE_REPO_READ;
  }
}

message LogoutRequest {}

message LogoutResponse {}

message GetViewerRequest {}

message GetViewerResponse {
  // The caller's user name.
  string user = 1;
  // A forge administrator (`is_admin`) whose credential holds the `admin` scope; always
  // the user's `is_admin` for a browser session, which holds every scope.
  bool admin = 2;
  // The caller's declared SSH keys, authentication and signing, ordered by usage then
  // fingerprint: read-only, from the configuration (0014, 0143).
  repeated SshKey keys = 3;
}

// An SSH public key's identity, never the key itself.
message SshKey {
  SshKeyUsage usage = 1;
  // The OpenSSH algorithm name, e.g. `ssh-ed25519`.
  string key_type = 2;
  // `SHA256:…`.
  string fingerprint = 3;
}

enum SshKeyUsage {
  SSH_KEY_USAGE_UNSPECIFIED = 0;
  // Authenticates Git over SSH.
  SSH_KEY_USAGE_AUTH = 1;
  // Signs commits and tags.
  SSH_KEY_USAGE_SIGNING = 2;
}
